[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "marcenaria-digital-api"
version = "0.1.0"
description = "API do projeto Marcenaria Digital"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
marcenaria_digital_api = ["repositories/json/configuracoes.json"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
